name: dgs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 3 9 *'

permissions:
  contents: write

jobs:
  fetch-build:
    runs-on: ubuntu-latest
    env:
      ALL_PROGRAMS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: fetch data
        run: |
          pip install requests pdfplumber pymupdf
          python scripts/fetch-dgs-data.py
          python scripts/build-dgs-static-data.py

      - name: stamp year
        run: |
          YEAR=$(python -c "import json;print(json.load(open('data/dgs/dgs-meta.json'))['lastFetchYear'])")
          sed -i "s/[0-9]\{4\} DGS/$YEAR DGS/g" dgs/index.html

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/dgs/static/
          git add -f dgs/index.html dgs.html sitemap.xml
          git diff --cached --quiet || git commit -m "Update DGS data: $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
