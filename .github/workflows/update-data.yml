name: yok

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 8 *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: node
        run: node fetch-data.js

      - name: static data
        run: node scripts/build-static-data.js

      - name: yil
        run: |
          YEAR=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/metadata.json','utf8')).lastFetchYear)")
          sed -i "s/__YEAR__/$YEAR/g" index.html

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/static/ sitemap.xml index.html
          git diff --cached --quiet || git commit -m "Veri guncellendi: $(date -u +%Y-%m-%d)"
          git push
