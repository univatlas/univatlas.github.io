name: yok

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 1 8 *'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: node
        run: node fetch-data.js

      - name: urap
        continue-on-error: true
        run: node scripts/build-urap.js

      - name: the
        continue-on-error: true
        run: |
          pip install scikit-learn
          python scripts/build-the.py

      - name: static data
        run: node scripts/build-static-data.js

      - name: yil
        run: |
          YEAR=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/metadata.json','utf8')).lastFetchYear)")
          sed -i "s/[0-9]\{4\} YKS/$YEAR YKS/g" index.html

      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/static/ data/urap/ data/the/ sitemap.xml index.html static.js
          git diff --cached --quiet || git commit -m "Veri guncellendi: $(date -u +%Y-%m-%d)"
          git push
